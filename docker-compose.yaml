version: '3.8'

services:
  app:
    image: php:8.5-fpm
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app